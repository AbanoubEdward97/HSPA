<div class="card">
    <div class="card-img-wrapper">
        <img class="propImg card-img-top" src='assets/Images/1.jpg' alt="Property Image">
        <ul class="list-inline list-unstyled text-center member-icons animate">
            <li class="list-inline-item ">
                <button class="btn btn-primary"><i class="fa-solid fa-pen-to-square"></i></button>
            </li>
            <li class="list-inline-item">
                <button class="btn btn-primary"><i class="fa-solid fa-address-book"></i></button>
            </li>
        </ul>
    </div>
    <div class="card-body p-2">
        <h1>{{property.Name}}</h1>
        <h2 class="">{{property.Type}}</h2>
        <h3 class="">{{property.Price}}</h3>
    </div>
</div>
